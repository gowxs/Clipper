# Pushes every commit on `main` to the Hugging Face Space, which rebuilds and redeploys it.
#
# One-time setup (see README → "Connect the Space to this GitHub repo"):
#   1. GitHub repo → Settings → Secrets and variables → Actions:
#        secret   HF_TOKEN     = a Hugging Face *write* token
#        variable HF_SPACE_ID  = <hf-username>/<space-name>   (e.g. gowxs/clipper)
#   2. Push to main.
name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-to-hf
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo "HF_TOKEN secret is missing"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add hf "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}"
          git push --force hf HEAD:main
